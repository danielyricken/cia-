<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Contato</title>
    <link rel="stylesheet" href="style.css">
    <!-- Ícones externos para um visual mais profissional -->
    <link rel="stylesheet" href="https://cloudflare.com">
</head>
<body>

    <div class="counter-box">
        <i class="fa-solid fa-users"></i>
        <span>Total de Contatos: <strong id="total-contatos">0</strong></span>
    </div>

    <div class="container">
        <h2><i class="fa-regular fa-envelope"></i> Entre em Contato</h2>
        <p class="subtitle">Preencha os campos abaixo para nos enviar uma mensagem.</p>

        <form id="form-contato" novalidate>
            
            <div class="input-group">
                <label for="nome">Nome Completo</label>
                <div class="input-icon-wrapper">
                    <i class="fa-regular fa-user"></i>
                    <input type="text" id="nome" placeholder="Digite seu nome">
                </div>
                <span class="erro-mensagem"></span>
            </div>

            <div class="grid-2-col">
                <div class="input-group">
                    <label for="email">E-mail</label>
                    <div class="input-icon-wrapper">
                        <i class="fa-regular fa-envelope"></i>
                        <input type="email" id="email" placeholder="seu.email@exemplo.com">
                    </div>
                    <span class="erro-mensagem"></span>
                </div>

                <div class="input-group">
                    <label for="telefone">Telefone (Celular)</label>
                    <div class="input-icon-wrapper">
                        <i class="fa-solid fa-phone"></i>
                        <input type="tel" id="telefone" placeholder="(XX) XXXXX-XXXX">
                    </div>
                    <span class="erro-mensagem"></span>
                </div>
            </div>

            <div class="grid-2-col">
                <div class="input-group">
                    <label for="data-nasc">Data de Nascimento</label>
                    <div class="input-icon-wrapper">
                        <i class="fa-regular fa-calendar"></i>
                        <input type="date" id="data-nasc">
                    </div>
                    <span class="erro-mensagem"></span>
                </div>

                <div class="input-group">
                    <label for="assunto">Assunto</label>
                    <div class="input-icon-wrapper">
                        <i class="fa-solid fa-list-check"></i>
                        <select id="assunto">
                            <option value="" disabled selected>Selecione uma opção</option>
                            <option value="suporte">Suporte Técnico</option>
                            <option value="comercial">Comercial / Vendas</option>
                            <option value="sugestao">Sugestões / Críticas</option>
                        </select>
                    </div>
                    <span class="erro-mensagem"></span>
                </div>
            </div>

            <div class="input-group">
                <div class="label-row">
                    <label for="mensagem">Mensagem</label>
                    <span id="contador-caracteres" class="char-counter">0 / 500</span>
                </div>
                <textarea id="mensagem" rows="4" maxlength="500" placeholder="Como podemos te ajudar?"></textarea>
                <span class="erro-mensagem"></span>
            </div>

            <div class="input-group checkbox-group">
                <label class="checkbox-container">
                    <input type="checkbox" id="termos">
                    <span class="checkmark"></span>
                    <span>Li e aceito os <a href="#">termos de privacidade</a>.</span>
                </label>
                <span class="erro-mensagem"></span>
            </div>

            <button type="submit" class="btn-submit">
                <span>Enviar Mensagem</span>
                <i class="fa-regular fa-paper-plane"></i>
            </button>
        </form>
    </div>

    <!-- Modal de Sucesso -->
    <div id="modal-sucesso" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-icon">
                <i class="fa-solid fa-circle-check"></i>
            </div>
            <h3>Sucesso!</h3>
            <p>Sua mensagem foi enviada e armazenada com sucesso.</p>
            <button id="btn-fechar-modal" class="btn-modal">Fechar</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
